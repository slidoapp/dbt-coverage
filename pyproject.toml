[tool.poetry]
name = "dbt-coverage"
version = "0.5.0"
description = "One-stop-shop for docs and test coverage of dbt projects"
authors = ["Andrej Švec <asvec@slido.com>"]
readme = 'README.md'
license = "MIT"
repository = "https://github.com/slidoapp/dbt-coverage"
homepage = "https://github.com/slidoapp/dbt-coverage"
documentation = "https://github.com/slidoapp/dbt-coverage"
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]

[tool.poetry.dependencies]
python = "^3.10"
typer = ">=0.4,<1"

[tool.poetry.group.dev.dependencies]
black = "==26.10.0"  # Use the same version as in .pre-commit-config.yaml
isort = "==9.0.2"  # Use the same version as in .pre-commit-config.yaml
pre-commit = "^4"
tox = "^4"

# Needed for running tests locally
[tool.poetry.group.test.dependencies]
pytest = "^9"
pytest-docker = "^3"
packaging = "*"  # Required for version comparison in tests

dbt-core = { version = "~1.12.0", python = "<3.15" }  # metricflow (dbt-core dependency) requires Python <3.15
dbt-postgres = { version = "~1.11.0", python = "<3.15" }  # 1.12 not yet on PyPI

[tool.poetry.scripts]
dbt-coverage = 'dbt_coverage.__init__:app'

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 99
